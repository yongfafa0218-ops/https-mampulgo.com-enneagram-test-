[build]
command = "pnpm install --frozen-lockfile && pnpm build"
publish = "dist/public"
functions = "netlify/functions"

[[redirects]]
from = "/*"
to = "/index.html"
status = 200

[context.production]
command = "pnpm install --frozen-lockfile && pnpm build"

[context.deploy-preview]
command = "pnpm install --frozen-lockfile && pnpm build"

[context.branch-deploy]
command = "pnpm install --frozen-lockfile && pnpm build"
